name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 버튼
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 시트 반영 (원하면 간격 조정)
  repository_dispatch:
    types: [sheet-updated]  # 시트 Apps Script 에서 트리거 (선택)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (시트 → index.html)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node scripts/build.mjs

      - name: Commit synced data
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git diff --staged --quiet || (git commit -m "chore: sync from Google Sheet" && git push)

      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html support.js .nojekyll _site/
          if [ -d assets ]; then cp -r assets/. _site/assets/ ; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
